<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Редактор графа знаний</title>
    <script src="https://unpkg.com/vis-network@9.1.2/standalone/umd/vis-network.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a1a; color: #ddd; }
        #toolbar {
            background: #2a2a2a;
            padding: 8px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            border-bottom: 1px solid #444;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        #toolbar button, #toolbar input, #toolbar select {
            background: #3a3a3a;
            color: #ddd;
            border: 1px solid #555;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }
        #toolbar button:hover { background: #555; }
        #toolbar .brand { font-weight: bold; color: #fff; margin-right: 10px; }
        #graph-container {
            width: 100%;
            height: calc(100vh - 60px);
            background: #1a1a1a;
            position: relative;
        }
        #info-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2a2a2a;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 16px;
            max-width: 300px;
            min-width: 220px;
            max-height: 70vh;
            overflow-y: auto;
            display: none;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        #info-panel.show { display: block; }
        #info-panel .close { float: right; cursor: pointer; color: #aaa; }
        #info-panel .close:hover { color: #fff; }
        #loading-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            display: none;
            z-index: 30;
        }
        #loading-indicator.show { display: block; }
        .neighbor-row {
            display: grid;
            grid-template-columns: 16px 1fr auto;
            gap: 6px;
            padding: 4px 0;
            cursor: pointer;
            border-radius: 4px;
        }
        .neighbor-row:hover { background: #3a3a3a; }
        .neighbor-row .w.neg { color: #ff6b6b; }
        .hint { color: #888; font-size: 12px; margin-top: 6px; }
        .info-row { display: flex; justify-content: space-between; margin: 4px 0; }
        .info-label { color: #888; }
        .info-value { color: #fff; font-weight: 500; }
        .btn-group { margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end; }
        .btn-group button { background: #3a3a3a; border: 1px solid #555; color: #ddd; padding: 4px 12px; border-radius: 4px; cursor: pointer; }
        .btn-group button:hover { background: #555; }
    </style>
</head>
<body>
    <div id="toolbar">
        <span class="brand">🧠 Граф знаний</span>
        <button id="refreshBtn">⟳ Обновить</button>
        <button id="resetPhysicsBtn">◎ Физика</button>
        <input type="text" id="newNodeLabelInput" placeholder="Название понятия" style="width:140px;">
        <select id="newNodeTypeSelect">
            <option value="CONCEPT">CONCEPT</option>
            <option value="SENSORY">SENSORY</option>
            <option value="MOTOR">MOTOR</option>
            <option value="EMOTIONAL">EMOTIONAL</option>
            <option value="ATTENTION">ATTENTION</option>
        </select>
        <button id="addNodeBtn">➕ Узел</button>
        <input type="number" id="weightInput" value="0.5" step="0.01" style="width:60px;">
        <button id="addEdgeBtn">➕ Ребро</button>
        <input type="text" id="newLabelInput" placeholder="Новая метка" style="width:140px;">
        <select id="editNodeTypeSelect">
            <option value="">тип: без изм.</option>
            <option value="CONCEPT">CONCEPT</option>
            <option value="SENSORY">SENSORY</option>
            <option value="MOTOR">MOTOR</option>
            <option value="EMOTIONAL">EMOTIONAL</option>
            <option value="ATTENTION">ATTENTION</option>
        </select>
        <label><input type="checkbox" id="reembedCheckbox" checked> embed</label>
        <button id="updateLabelBtn">✎ Изменить</button>
        <button id="deleteNodeBtn">🗑 Узел</button>
        <button id="deleteEdgeBtn">🗑 Ребро</button>
        <button id="saveBtn">💾 Сохранить</button>
    </div>
    <div id="graph-container"></div>
    <div id="info-panel">
        <span class="close" id="closeInfo">✖</span>
        <div id="infoContent"></div>
        <div class="btn-group">
            <button id="focusNodeBtn">🎯 Центрировать</button>
        </div>
    </div>
    <div id="loading-indicator">🔄 Загрузка графа...</div>
    <script src="/static/js/graf.js"></script>
</body>
</html>
