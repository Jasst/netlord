<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Smart Brain v6</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-left">
                <button class="icon-btn" id="toggleChatList" title="Свернуть/развернуть чаты" aria-label="Чаты">☰</button>
                <h1>🧠 Smart Brain <span>v6</span></h1>
            </div>
            <div class="header-right">
                <div class="control-group">
                    <label for="tempSlider" title="Температура">🌡️</label>
                    <input type="range" id="tempSlider" min="0.1" max="1.5" step="0.1" value="0.7" aria-label="Температура" />
                    <span id="tempDisplay">0.7</span>
                </div>
                <button class="icon-btn" id="toggleSettings" title="Настройки" aria-label="Настройки">⚙️</button>
            </div>
        </header>

        <div class="app-container">
            <aside class="chat-list" id="chatList" aria-label="Список чатов">
                <div class="list-header">
                    <span>Чаты</span>
                    <button id="newChatBtn">+ Новый</button>
                </div>
                <div class="chat-items" id="chatItems"></div>
            </aside>

            <main class="chat-area">
                <div class="messages" id="messages"></div>

                <div class="input-wrapper">
                    <div class="input-area">
                        <textarea id="questionInput" placeholder="Введите вопрос…" rows="1" autocomplete="off" aria-label="Вопрос"></textarea>
                        <button id="sendBtn" aria-label="Отправить" disabled></button>
                    </div>
                    <div class="learn-buttons" id="learnButtons">
                        <button id="learnPosBtn" title="Положительное обучение" aria-label="Положительное" style="display:none;">✅</button>
                        <button id="learnNegBtn" class="neg" title="Отрицательное обучение" aria-label="Отрицательное" style="display:none;">❌</button>
                    </div>
                </div>
            </main>

            <aside class="settings-panel" id="settingsPanel" aria-label="Настройки">
                <div class="settings-section">
                    <h3>📊 Статистика</h3>
                    <div id="statsContainer">
                        <div class="stat-item"><span class="label">Нейроны</span><span class="value" id="statNeurons">-</span></div>
                        <div class="stat-item"><span class="label">Синапсы</span><span class="value" id="statSynapses">-</span></div>
                        <div class="stat-item"><span class="label">Понятия</span><span class="value" id="statConcepts">-</span></div>
                        <div class="stat-item"><span class="label">Факты KB</span><span class="value" id="statKB">-</span></div>
                        <div class="stat-item"><span class="label">Память</span><span class="value" id="statMemory">-</span></div>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>📚 Факты</h3>
                    <div id="factsList"><p class="empty-hint">Факты появятся после ответа.</p></div>
                </div>

                <div class="settings-section">
                    <h3>💬 Диалог</h3>
                    <label class="checkbox-label"><input type="checkbox" id="allowClarifying" checked /> <span>Уточняющие вопросы</span></label>
                    <div class="range-group">
                        <label>Задержка</label>
                        <input type="range" id="clarifyingDelay" min="0.5" max="5" step="0.1" value="1.5" />
                        <span id="delayDisplay">1.5</span>с
                    </div>
                </div>

                <div class="settings-section">
                    <h3>🤖 Агент (интерактив)</h3>
                    <label class="checkbox-label"><input type="checkbox" id="interactiveMode" /> <span>Вопросы агента</span></label>
                    <div class="input-group">
                        <label>Таймаут (сек)</label>
                        <input type="number" id="userTimeout" value="30" min="5" max="120" />
                    </div>
                    <button id="applyAgentConfig">Применить</button>
                    <div class="log" id="interactiveLog">Выключен.</div>
                </div>

                <div class="settings-section">
                    <h3>🚀 Автообучение</h3>
                    <div class="input-group"><label>Тема</label><input type="text" id="trainTopic" value="солнце" /></div>
                    <div class="input-group"><label>Пар</label><input type="number" id="trainNumPairs" value="30" min="10" max="200" /></div>
                    <div class="input-group"><label>Темп.</label><input type="number" id="trainTemp" value="0.7" step="0.1" min="0.1" max="1.0" /></div>
                    <div class="input-group"><label>Neg. ratio</label><input type="number" id="trainNegRatio" value="0.2" step="0.05" min="0" max="1" /></div>
                    <div class="input-group"><label>Эпохи</label><input type="number" id="trainEpochs" value="1" min="1" max="10" /></div>
                    <label class="checkbox-label"><input type="checkbox" id="trainIntegrate" checked /> <span>Интеграция</span></label>
                    <button id="trainTopicBtn">🚀 Обучить</button>
                    <div class="log" id="trainLog">Готов.</div>
                </div>

                <div class="settings-section">
                    <h3>📝 Обучить пару</h3>
                    <div class="input-group"><label>Вопрос</label><input type="text" id="pairQuestion" placeholder="Вопрос" /></div>
                    <div class="input-group"><label>Ответ</label><input type="text" id="pairAnswer" placeholder="Ответ" /></div>
                    <div class="input-group"><label>Эпохи</label><input type="number" id="pairEpochs" value="3" min="1" max="20" /></div>
                    <button id="trainPairBtn">🧠 Обучить</button>
                    <div class="log" id="pairLog">Готов.</div>
                </div>

                <div class="settings-section">
                    <h3>💤 Сон</h3>
                    <button id="sleepBtn">💤 Запустить сон</button>
                    <div class="log" id="sleepLog">Готов.</div>
                </div>

                <div class="settings-section">
                    <h3>🤖 Агент-исследователь</h3>
                    <button id="agentToggleBtn">⏸ Остановить</button>
                    <div class="input-group"><label>Темы (через ,)</label><input type="text" id="agentTopics" value="наука, природа, технологии, история, искусство, философия" /></div>
                    <div class="input-group"><label>Интервал (сек)</label><input type="number" id="agentInterval" value="120" min="10" /></div>
                    <div class="input-group"><label>Вопросов/цикл</label><input type="number" id="agentQCount" value="2" min="1" max="10" /></div>
                    <button id="updateAgentConfig">⚙️ Обновить</button>
                    <div class="log" id="agentLog">Агент активен.</div>
                </div>
            </aside>
        </div>

        <div class="overlay" id="overlay" aria-hidden="true"></div>
    </div>
    <!-- Модальное окно для подтверждения -->
    <div id="confirmModal" style="display:none; position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.7); align-items:center; justify-content:center;">
    <div style="background:#1a1a1a; padding:24px; border-radius:16px; max-width:400px; border:1px solid #333; box-shadow:0 8px 30px rgba(0,0,0,0.8);">
        <p id="confirmMessage" style="margin-bottom:20px; font-size:16px; color:#e0e0e0;">Удалить чат?</p>
        <div style="display:flex; gap:12px; justify-content:flex-end;">
            <button id="confirmCancelBtn" style="padding:8px 20px; background:#2a2a2a; border:1px solid #444; border-radius:8px; color:#aaa; cursor:pointer;">Отмена</button>
            <button id="confirmOkBtn" style="padding:8px 20px; background:#9a4a4a; border:1px solid #7a3a3a; border-radius:8px; color:#fff; cursor:pointer;">Удалить</button>
        </div>
    </div>
</div>
    <!-- ===== Кастомный тост для уведомлений ===== -->
    <div id="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
